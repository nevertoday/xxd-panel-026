    <path d="M662 84H1138M662 336H1138" stroke="#686E69" stroke-opacity="0.12"/>
  </g>

  <rect x="22" y="22" width="1156" height="356" rx="22" stroke="#6A706B" stroke-opacity="0.22"/>

  <text x="1044" y="42" text-anchor="end" fill="#59615E" fill-opacity="0.62" font-family="Arial, sans-serif" font-size="12" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
  <text x="1128" y="42" text-anchor="end" direction="rtl" fill="#59615E" fill-opacity="0.62" font-family="Arial, sans-serif" font-size="12" font-weight="700">العربية</text>

  <g>
    <rect x="72" y="62" width="202" height="34" rx="17" fill="#65766D"/>
    <text x="92" y="84" fill="#F7F1E8" font-family="Arial" font-size="14" font-weight="800" letter-spacing="2">XXD / IMAGE SKILL</text>
    <text x="70" y="164" fill="#313A37" font-family="Arial" font-size="65" font-weight="900" letter-spacing="-2">PANEL <tspan fill="#A76F62">026</tspan></text>
    <text x="72" y="210" fill="#7B6670" font-family="Arial" font-size="25" font-weight="850" letter-spacing="1">QUIET HUMANIST GEOMETRY</text>
    <text x="72" y="249" fill="#59615E" font-family="Arial" font-size="18" font-weight="600">Recognisable form. Gentle rhythm. Barely raised paper.</text>
  </g>

  <g filter="url(#soft)">
    <rect x="72" y="292" width="156" height="44" rx="9" fill="#F5EEE4" stroke="#77817C" stroke-opacity="0.24"/>
    <text x="91" y="320" fill="#4E5854" font-family="Menlo" font-size="14" font-weight="800">4–6 COLOURS</text>
