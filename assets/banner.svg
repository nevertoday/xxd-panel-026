<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 026</title>
  <desc>Quiet humanist geometry, soft source-derived color, fine structural lines, subtle pressed-paper relief, and multilingual documentation including Korean and Arabic.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F0E6"/>
      <stop offset="0.55" stop-color="#EEE7DC"/>
      <stop offset="1" stop-color="#E5DED4"/>
    </linearGradient>
    <pattern id="fiber" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M6 15L14 13M32 39L40 37M46 7L50 6M12 47L18 45" stroke="#6E756F" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="24" cy="18" r="0.9" fill="#B68778" fill-opacity="0.09"/>
      <circle cx="44" cy="29" r="0.8" fill="#698595" fill-opacity="0.08"/>
    </pattern>
    <filter id="relief" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.82"/>
      <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#83786B" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#7A6B5F" flood-opacity="0.14"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#paper)"/>
    <rect width="1200" height="400" fill="url(#fiber)"/>
    <circle cx="1116" cy="62" r="194" fill="#AEBDAA" fill-opacity="0.22"/>
    <rect x="716" y="-30" width="184" height="480" rx="92" transform="rotate(12 716 -30)" fill="#CFA89B" fill-opacity="0.15"/>
